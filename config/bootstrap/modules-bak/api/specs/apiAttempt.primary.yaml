version: 1
kind: table
name: ApiAttempt
primary: true
tableType: primary
description: Tracks multi-instance API/CRUD attempts and outcomes.
tags:
  - core
  - api
  - attempts

table:
  model: "apiAttempt"
  type: "NORMAL"
  drop: false
  schemaMode: schemaless
  permissions: full

id:
  exportType: true
  type: string
  exportName: __NAME__ID
  structure: default

fields:
  - requestId:
      type: string
      required: false
      default: ""
  - app:
      type: string
      required: false
      default: ""
  - endpoint:
      type: string
      required: true
      default: ""
  - method:
      type: enum<"query" | "mutate">
      required: false
      default: "mutate"
  - strategy:
      type: enum<"fail-fast" | "continue-on-error">
      required: false
      default: "fail-fast"
  - data:
      type: object
      required: false
  - instances:
      type: array<string>
      required: false
      default: []
  - instanceResults:
      type: object
      required: false
  - bypassMothership:
      type: boolean
      required: false
      default: false
  - rootInstance:
      type: string
      required: false
      default: ""
  - requireMothership:
      type: boolean
      required: false
      default: true
  - dataLocation:
      type: enum<"local" | "remote">
      required: false
      default: "local"
  - options:
      type: object
      required: false
  - results:
      type: object
      required: false
  - summary:
      type: object
      required: false
  - record:
      type: object
      required: false
  - payload:
      type: object
      required: false
  - error:
      type: object
      required: false
  - attempts:
      type: number
      required: false
      default: 0
  - startedAt:
      type: datetime
      required: false
      default: time::now()
  - updatedAt:
      type: datetime
      required: false
      default: time::now()
  - endedAt:
      type: datetime
      required: false
      default: null
  - status:
      type: enum<"pending" | "success" | "partial" | "failed">
      required: false
      default: "pending"

edges:
  has: []
  belongs: []

crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
    options:
      validations:
        required:
          - endpoint

  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
    options:
      validations:
        required:
          - rid

  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record

router:
  name: apiAttempt
  endpoints:
    - create
    - update
    - delete

delete:
  enabled: true
