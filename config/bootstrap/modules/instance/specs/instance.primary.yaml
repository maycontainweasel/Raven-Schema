version: 1
kind: table
name: Instance
primary: true
tableType: primary
description: Primary instance entity representing a single Passmed installation instance.
tags:
  - core
  - instance

table:
  model: "instance"
  type: "NORMAL"
  drop: false
  schemaMode: schemaless
  permissions: full

id:
  exportType: true
  type: string
  exportName: __NAME__ID
  structure: key

# Fields describe the full exam payload stored on the primary table.
fields:
  - key:
      type: string
      required: true
      default: ""
  - instance: # This is only used by the local instance record
      type: string
      required: false 
      default: $key
  - title:
      type: string
      required: true
      default: ""

edges:
  has: 
    - table: "Instances"
      in: "record"
      out: "instance"
  belongs: []

post:
  enabled: false

indexes:
  - name: InstanceKey
    mode: OVERWRITE
    columns:
      - key
    unique: true
    comment: "Ensures each instance key is unique"


crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
    options:
      idSource: key
      validations:
        required:
          - key
          - title

  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
    options:
      validations:
        required:
          - rid

  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
    options:
      validations:
        required:
          - rid

router:
  name: instance
  endpoints:
    - typesense:
        target: view
        value: Typesense
    - resource:
        adminSingle:
          target: view
          value: AdminSingle
        public:
          target: view
          value: Public
        typesense:
          target: view
          value: Typesense
    - create:
        target: crud
        value: create
    - update:
        target: crud
        value: update
    - delete:
        target: crud
        value: delete

delete:
  enabled: true
