version: 1
kind: table
name: Account
primary: true
tableType: primary
description: Real-world bank, card, savings, loan, debt, investment, cash, or
  other account inside a financial space
table:
  model: account
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: AccountId
  structure: key
modelSettings:
  authority: source
fields:
  - space:
      type: record<financialSpace>
      required: true
      default: ""
  - key:
      type: string
      required: true
      default: ""
  - name:
      type: string
      required: true
      default: ""
  - bankName:
      type: string
      required: true
      default: ""
  - accountType:
      type: enum<"current" | "credit_card" | "savings" | "loan" | "debt" |
        "investment" | "cash" | "other">
      required: true
      default: current
  - currency:
      type: string
      required: true
      default: ZAR
  - accountNumberLast4:
      type: string
      default: ""
  - openingBalance:
      type: number
      default: 0
  - active:
      type: boolean
      required: true
      default: true
  - notes:
      type: string
      default: ""
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: account
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - space
      - key
      - name
      - bankName
      - accountType
      - currency
      - accountNumberLast4
      - openingBalance
      - active
      - notes
refreshViews: true
admin:
  authority: source
  data: source
