version: 1
kind: table
name: BookingHold
primary: true
tableType: primary
description: Temporary slot reservation during checkout
table:
  model: bookingHold
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: BookingHoldId
  structure: holdRef
fields:
  - holdRef:
      type: string
      required: true
      default: ""
  - booking:
      type: record<booking>
      default: ""
      assign: true
  - service:
      type: record<serviceDefinition>
      required: true
      default: ""
      assign: true
  - status:
      type: enum<"active" | "expired" | "released" | "consumed">
      required: true
      default: active
  - startAt:
      type: datetime
      required: true
      default: time::now()
  - endAt:
      type: datetime
      required: true
      default: time::now()
  - timezone:
      type: string
      required: true
      default: Africa/Johannesburg
  - expiresAt:
      type: datetime
      required: true
      default: time::now()
  - players:
      type: number
      required: true
      default: 1
  - leftHandedRequired:
      type: boolean
      default: false
  - resourceCount:
      type: number
      required: true
      default: 1
  - assignedResources:
      type: array
      default: []
  - customerEmail:
      type: email
      default: ""
  - quote:
      type: object
  - source:
      type: enum<"public" | "admin" | "system">
      required: true
      default: public
  - metadata:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: bookingHold
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - holdRef
      - booking
      - service
      - status
      - startAt
      - endAt
      - timezone
      - expiresAt
      - players
      - leftHandedRequired
      - resourceCount
      - assignedResources
      - customerEmail
      - quote
      - source
      - metadata
refreshViews: true
admin:
  slugPolicy: holdRef
