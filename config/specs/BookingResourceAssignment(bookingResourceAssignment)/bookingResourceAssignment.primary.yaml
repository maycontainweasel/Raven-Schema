version: 1
kind: table
name: BookingResourceAssignment
primary: true
tableType: primary
description: Assigned resources for held/confirmed windows
table:
  model: bookingResourceAssignment
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: BookingResourceAssignmentId
  structure: key
fields:
  - key:
      type: string
      required: true
      default: ""
  - booking:
      type: record<booking>
      required: true
      default: ""
      assign: true
  - hold:
      type: record<bookingHold>
      default: ""
      assign: true
  - resource:
      type: record<resource>
      required: true
      default: ""
      assign: true
  - service:
      type: record<serviceDefinition>
      required: true
      default: ""
      assign: true
  - state:
      type: enum<"held" | "confirmed" | "cancelled" | "released">
      required: true
      default: held
  - startAt:
      type: datetime
      required: true
      default: time::now()
  - endAt:
      type: datetime
      required: true
      default: time::now()
  - timezone:
      type: string
      required: true
      default: Africa/Johannesburg
  - assignedAt:
      type: datetime
      required: true
      default: time::now()
  - releasedAt:
      type: datetime
      default: null
  - metadata:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: bookingResourceAssignment
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - key
      - booking
      - hold
      - resource
      - service
      - state
      - startAt
      - endAt
      - timezone
      - assignedAt
      - releasedAt
      - metadata
refreshViews: true
admin:
  slugPolicy: key
