version: 1
kind: table
name: BookingResourceAssignment
primary: true
tableType: primary
description: Resource assignments linked to booking windows for hold and confirmed states.
table:
  model: bookingResourceAssignment
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  structure: key
  exportType: true
  exportName: BookingResourceAssignmentId
fields:
  - key:
      type: string
      required: true
      default: |-
        {
          string::concat("BRA-", string::uppercase(string::slice(rand::ulid(), 0, 10)))
        }
  - booking:
      type: record<booking>
      required: true
      default: ""
  - hold:
      type: record<bookingHold>
      required: false
      default: ""
  - resource:
      type: record<resource>
      required: true
      default: ""
  - service:
      type: record<serviceDefinition>
      required: true
      default: ""
  - state:
      type: enum<"held" | "confirmed" | "cancelled" | "released">
      required: true
      default: "held"
  - startAt:
      type: datetime
      required: true
      default: time::now()
  - endAt:
      type: datetime
      required: true
      default: time::now()
  - timezone:
      type: string
      required: true
      default: "Africa/Johannesburg"
  - assignedAt:
      type: datetime
      required: true
      default: time::now()
  - releasedAt:
      type: datetime
      required: false
      default: null
  - metadata:
      type: object
      required: false
      default: {}
indexes:
  - name: BookingResourceAssignmentKey
    mode: OVERWRITE
    columns:
      - key
    unique: true
  - name: BookingResourceAssignmentWindow
    mode: OVERWRITE
    columns:
      - resource
      - startAt
      - endAt
      - state
    unique: false
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
    options:
      idSource: key
      validations:
        required:
          - key
          - booking
          - resource
          - service
          - startAt
          - endAt
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: bookingResourceAssignment
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - key
      - booking
      - hold
      - resource
      - service
      - state
      - startAt
      - endAt
      - timezone
      - assignedAt
      - releasedAt
      - metadata
    fetch:
      - booking
      - hold
      - resource
      - service
admin:
  slugPolicy: key
  data: local
delete:
  enabled: true
