version: 1
kind: table
name: BookingTimelineEvent
primary: true
tableType: primary
description: Audit trail events for booking lifecycle
table:
  model: bookingTimelineEvent
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  structure: eventRef
  exportType: true
  exportName: BookingTimelineEventId
fields:
  - eventRef:
      type: string
      required: true
      default: ""
  - booking:
      type: record<booking>
      required: true
      default: ""
      assign: true
  - eventType:
      type: enum<"hold_created" | "hold_expired" | "payment_initiated" |
        "payment_paid" | "payment_failed" | "booking_confirmed" |
        "booking_cancelled" | "assignment_created" | "assignment_released" |
        "admin_updated">
      required: true
      default: admin_updated
  - actorType:
      type: enum<"customer" | "admin" | "system" | "provider">
      required: true
      default: system
  - actorId:
      type: string
      default: ""
  - summary:
      type: string
      required: true
      default: ""
  - occurredAt:
      type: datetime
      required: true
      default: time::now()
  - payload:
      type: object
  - metadata:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: bookingTimelineEvent
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - eventRef
      - booking
      - eventType
      - actorType
      - actorId
      - summary
      - occurredAt
      - payload
      - metadata
refreshViews: true
admin:
  slugPolicy: eventRef
