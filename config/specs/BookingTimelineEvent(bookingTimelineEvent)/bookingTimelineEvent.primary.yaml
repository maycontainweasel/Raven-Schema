version: 1
kind: table
name: BookingTimelineEvent
primary: true
tableType: primary
description: Immutable audit trail events for booking lifecycle changes.
table:
  model: bookingTimelineEvent
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  structure: eventRef
  exportType: true
  exportName: BookingTimelineEventId
fields:
  - eventRef:
      type: string
      required: true
      default: |-
        {
          string::concat("EVT-", string::uppercase(string::slice(rand::ulid(), 0, 10)))
        }
  - booking:
      type: record<booking>
      required: true
      default: ""
  - eventType:
      type: enum<"hold_created" | "hold_expired" | "payment_initiated" | "payment_paid" | "payment_failed" | "booking_confirmed" | "booking_cancelled" | "assignment_created" | "assignment_released" | "admin_updated">
      required: true
      default: "admin_updated"
  - actorType:
      type: enum<"customer" | "admin" | "system" | "provider">
      required: true
      default: "system"
  - actorId:
      type: string
      required: false
      default: ""
  - summary:
      type: string
      required: true
      default: ""
  - occurredAt:
      type: datetime
      required: true
      default: time::now()
  - payload:
      type: object
      required: false
      default: {}
  - metadata:
      type: object
      required: false
      default: {}
indexes:
  - name: BookingTimelineRef
    mode: OVERWRITE
    columns:
      - eventRef
    unique: true
  - name: BookingTimelineByBooking
    mode: OVERWRITE
    columns:
      - booking
      - occurredAt
    unique: false
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
    options:
      idSource: eventRef
      validations:
        required:
          - booking
          - eventType
          - actorType
          - summary
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: bookingTimelineEvent
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - eventRef
      - booking
      - eventType
      - actorType
      - actorId
      - summary
      - occurredAt
      - payload
      - metadata
    fetch:
      - booking
admin:
  slugPolicy: eventRef
  data: local
delete:
  enabled: true
