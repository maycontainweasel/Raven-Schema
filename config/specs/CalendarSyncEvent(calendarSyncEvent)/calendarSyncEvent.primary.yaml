      type: string
      required: true
      default: ""
  - provider:
      type: '"google_calendar"'
      required: true
      default: google_calendar
  - booking:
      type: record<booking>
      default: ""
      assign: true
  - resource:
      type: record<resource>
      default: ""
      assign: true
  - calendarId:
      type: string
      required: true
      default: ""
  - providerEventId:
      type: string
      default: ""
