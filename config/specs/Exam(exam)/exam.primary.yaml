version: 1
kind: table
name: Exam
primary: true
tableType: primary
description: Primary exam entity representing a single exam and its display metadata
table:
  model: exam
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: ExamId
  structure: key
modelSettings:
  authority: source
fields:
  - key:
      type: string
      required: true
      default: ""
  - title:
      type: string
      required: true
      default: ""
  - titleShort:
      type: string
      default: ""
  - description:
      type: string
      default: ""
  - college:
      type: string
      default: ""
  - sheetId:
      type: string
      default: ""
  - qidIndex:
      type: number
      required: true
      default: 0
  - order:
      type: number
      default: 0
  - instances:
      type: array
      required: true
      default: []
  - colours:
      type: object
      fields:
        gradient:
          type: object
          fields:
            first:
              type: string
              default: "#F1CB40"
            second:
              type: string
              default: "#FFDA52"
        primary:
          type: string
          default: "#F1CB40"
        secondary:
          type: string
          default: "#FFDA52"
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: exam
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - key
      - title
      - titleShort
      - college
      - order
      - qidIndex
      - sheetId
      - description
      - instances
      - colours
    as:
      - post: (select status, createdAt, updatedAt from only fn::PID($this.id))
  - name: Public
    fields:
      - id
      - key
      - title
      - titleShort
      - description
      - colours
typesense:
  view:
    name: Typesense
    fields:
      - key
      - title
      - titleShort
      - college
      - qidIndex
    functionMode: generate
    function: viewExamTypesense
    as:
      - instances: $instances
      - post: (select status, createdAt, updatedAt from only fn::PID($this.id))
      - id: (<string> record::id($this.id))
    __programFieldLists:
      post:
        - status
        - createdAt
        - updatedAt
  schema:
    collection: exam
    fields:
      - name: id
        type: string
      - name: key
        type: string
      - name: title
        type: string
      - name: titleShort
        type: string
      - name: college
        type: string
      - name: qidIndex
        type: int32
      - name: instances
        type: string[]
        facet: true
      - name: post
        type: object
        fields:
          - name: status
            type: string
          - name: createdAt
            type: string
          - name: updatedAt
            type: string
    sortableFields:
      - title
      - key
    settings:
      enable_nested_fields: true
      default_sorting_field: title
  meta:
    settings:
      synonyms: false
      searchAsYouType: false
      perDocumentSynonyms: false
      perDocumentSearchAsYouType: false
      queryBy:
        - title
      queryByWeights:
        - 1
    fields:
      post:
        fields: {}
relations:
  - edge: ExamQuestions
    left: exam
    right: q
    cardinality: many
    storeOnModel: false
    payloadField: exams
    linkOnCreate: true
    required: true
    processor: functions
    hook: right
  - edge: ExamBuilderPage
    left: exam
    right: builderPage
    cardinality: one
    storeOnModel: false
    payloadField: builder
    linkOnCreate: true
    required: false
    processor: functions
    hook: right
instance: true
post:
  enabled: true
  create:
    fields:
      title: title
refreshViews: true
admin:
  slugPolicy: key
  authority: source
  data: source
