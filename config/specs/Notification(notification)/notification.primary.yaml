version: 1
kind: table
name: Notification
primary: true
tableType: primary
description: Dashboard notifications and updates
table:
  model: notification
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: NotificationId
modelSettings:
  authority: tenant
fields:
  - title:
      type: string
      required: true
      default: ""
  - summary:
      type: string
      default: ""
  - body:
      type: string
      required: true
      default: ""
  - image:
      type: string
      default: ""
  - ctaLabel:
      type: string
      default: ""
  - ctaUrl:
      type: string
      default: ""
  - publishAt:
      type: datetime
      default: ""
  - order:
      type: number
      default: 0
  - active:
      type: boolean
      required: true
      default: true
  - instances:
      type: array
      required: true
      default: []
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: notification
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - title
      - summary
      - body
      - image
      - ctaLabel
      - ctaUrl
      - publishAt
      - order
      - active
      - instances
    as:
      - post: (select status, createdAt, updatedAt from only fn::PID($this.id))
  - name: Public
    fields:
      - id
      - title
      - summary
      - body
      - image
      - ctaLabel
      - ctaUrl
      - publishAt
      - order
      - active
      - instances
typesense:
  view:
    name: Typesense
    fields:
      - id
      - title
      - summary
      - body
      - publishAt
      - order
      - active
    functionMode: generate
    function: viewNotificationTypesense
    as:
      - instances: $instances
      - post: (select status, createdAt, updatedAt from only fn::PID($this.id))
    __programFieldLists:
      post:
        - status
        - createdAt
        - updatedAt
  schema:
    collection: notification
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: summary
        type: string
      - name: body
        type: string
      - name: publishAt
        type: string
      - name: order
        type: int32
      - name: active
        type: bool
      - name: instances
        type: string[]
        facet: true
      - name: post
        type: object
        fields:
          - name: status
            type: string
          - name: createdAt
            type: string
          - name: updatedAt
            type: string
    sortableFields:
      - publishAt
      - order
    settings:
      enable_nested_fields: true
      default_sorting_field: publishAt
  meta:
    settings:
      synonyms: false
      searchAsYouType: false
      perDocumentSynonyms: false
      perDocumentSearchAsYouType: false
      queryBy:
        - title
        - summary
        - body
      queryByWeights:
        - 2
        - 1
        - 1
      filters:
        - instances
    fields:
      post:
        fields: {}
instance: true
post: true
refreshViews: true
admin:
  authority: tenant
  data: tenant
