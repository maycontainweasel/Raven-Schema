version: 1
kind: table
name: Order
primary: true
tableType: primary
description: Commercial order record for a booking
table:
  model: order
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: OrderId
  structure: orderRef
fields:
  - orderRef:
      type: string
      required: true
      default: ""
  - booking:
      type: record<booking>
      required: true
      default: ""
      assign: true
  - status:
      type: enum<"pending" | "paid" | "failed" | "cancelled" | "refunded_manual">
      required: true
      default: pending
  - paymentProvider:
      type: '"paygate"'
      required: true
      default: paygate
  - paymentReference:
      type: string
      default: ""
  - customerName:
      type: string
      required: true
      default: ""
  - customerEmail:
      type: email
      required: true
      default: ""
  - customerMobile:
      type: string
      required: true
      default: ""
  - subtotal:
      type: number
      required: true
      default: 0
  - discountTotal:
      type: number
      required: true
      default: 0
  - total:
      type: number
      required: true
      default: 0
  - currency:
      type: string
      required: true
      default: ZAR
  - paidAt:
      type: datetime
      default: null
  - cancelledAt:
      type: datetime
      default: null
  - metadata:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: order
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - orderRef
      - booking
      - status
      - paymentProvider
      - paymentReference
      - customerName
      - customerEmail
      - customerMobile
      - subtotal
      - discountTotal
      - total
      - currency
      - paidAt
      - cancelledAt
      - metadata
refreshViews: true
admin:
  slugPolicy: orderRef
