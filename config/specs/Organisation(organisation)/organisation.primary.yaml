  exportType: true
  exportName: OrganisationId
  structure: slug
modelSettings:
  authority: source
fields:
  - title:
      type: string
      required: true
      default: ""
  - slug:
      type: string
      required: true
      default: ""
  - description:
      type: string
      default: ""
  - website:
      type: string
      default: ""
  - email:
      type: string
      default: ""
  - phone:
      type: string
      default: ""
  - industry:
      type: string
      default: ""
  - size:
      type: string
      default: ""
  - logo:
      type: string
      default: ""
  - address:
      type: object
      fields:
        line1:
          type: string
          default: ""
        line2:
          type: string
          default: ""
        city:
          type: string
          default: ""
        region:
          type: string
          default: ""
        postcode:
          type: string
          default: ""
        country:
          type: string
          default: ""
  - instances:
      type: array<string>
      default: []
