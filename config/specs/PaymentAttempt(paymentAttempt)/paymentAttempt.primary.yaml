version: 1
kind: table
name: PaymentAttempt
primary: true
tableType: primary
description: Payment provider redirect/callback trace
table:
  model: paymentAttempt
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: PaymentAttemptId
  structure: attemptRef
fields:
  - attemptRef:
      type: string
      required: true
      default: ""
  - booking:
      type: record<booking>
      required: true
      default: ""
      assign: true
  - order:
      type: record<order>
      default: ""
      assign: true
  - provider:
      type: '"paygate"'
      required: true
      default: paygate
  - status:
      type: enum<"initiated" | "redirected" | "pending_callback" | "paid" | "failed" |
        "cancelled" | "error">
      required: true
      default: initiated
  - providerReference:
      type: string
      default: ""
  - providerStatus:
      type: string
      default: ""
  - amount:
      type: number
      required: true
      default: 0
  - currency:
      type: string
      required: true
      default: ZAR
  - redirectUrl:
      type: string
      default: ""
  - returnUrl:
      type: string
      default: ""
  - notifyUrl:
      type: string
      default: ""
  - errorMessage:
      type: string
      default: ""
  - requestPayload:
      type: object
  - responsePayload:
      type: object
  - startedAt:
      type: datetime
      required: true
      default: time::now()
  - completedAt:
      type: datetime
      default: null
  - metadata:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: paymentAttempt
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - attemptRef
      - booking
      - order
      - provider
      - status
      - providerReference
      - providerStatus
      - amount
      - currency
      - redirectUrl
      - returnUrl
      - notifyUrl
      - errorMessage
      - requestPayload
      - responsePayload
      - startedAt
      - completedAt
      - metadata
refreshViews: true
admin:
  slugPolicy: attemptRef
