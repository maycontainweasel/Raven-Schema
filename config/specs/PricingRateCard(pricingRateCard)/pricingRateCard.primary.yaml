version: 1
kind: table
name: PricingRateCard
primary: true
tableType: primary
description: Rule-based pricing matrix rows used by the booking quote engine.
table:
  model: pricingRateCard
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  structure: key
  exportType: true
  exportName: PricingRateCardId
fields:
  - key:
      type: string
      required: true
      default: ""
  - name:
      type: string
      required: true
      default: ""
  - service:
      type: record<serviceDefinition>
      required: true
      default: ""
  - active:
      type: boolean
      required: true
      default: true
  - currency:
      type: string
      required: true
      default: "ZAR"
  - pricingMode:
      type: enum<"per_player_per_hour" | "flat_per_bay" | "flat_per_child">
      required: true
      default: "per_player_per_hour"
  - timeBand:
      type: enum<"peak" | "off_peak" | "any">
      required: true
      default: "any"
  - playerCount:
      type: number
      required: false
      default: 0
  - ageCategory:
      type: enum<"adult" | "junior" | "senior" | "any">
      required: true
      default: "any"
  - minDurationHours:
      type: number
      required: false
      default: 1
  - maxDurationHours:
      type: number
      required: false
      default: 4
  - amount:
      type: number
      required: true
      default: 0
  - amountMode:
      type: enum<"per_hour" | "flat_total">
      required: true
      default: "per_hour"
  - weekdayMask:
      type: array
      required: false
      items:
        type: string
      default: []
  - effectiveFrom:
      type: datetime
      required: false
      default: null
  - effectiveTo:
      type: datetime
      required: false
      default: null
  - priority:
      type: number
      required: false
      default: 0
  - metadata:
      type: object
      required: false
      default: {}
indexes:
  - name: PricingRateCardLookup
    mode: OVERWRITE
    columns:
      - service
      - active
      - timeBand
      - playerCount
      - ageCategory
      - priority
    unique: false
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
    options:
      idSource: key
      validations:
        required:
          - key
          - name
          - service
          - pricingMode
          - amount
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: pricingRateCard
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - key
      - name
      - service
      - active
      - currency
      - pricingMode
      - timeBand
      - playerCount
      - ageCategory
      - minDurationHours
      - maxDurationHours
      - amount
      - amountMode
      - weekdayMask
      - effectiveFrom
      - effectiveTo
      - priority
      - metadata
    fetch:
      - service
admin:
  slugPolicy: key
  data: local
delete:
  enabled: true
