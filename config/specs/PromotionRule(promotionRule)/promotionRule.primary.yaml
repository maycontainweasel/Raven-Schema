version: 1
kind: table
name: PromotionRule
primary: true
tableType: primary
description: Promotional discounts evaluated against quote context
table:
  model: promotionRule
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  structure: key
  exportType: true
  exportName: PromotionRuleId
fields:
  - key:
      type: string
      required: true
      default: ""
  - name:
      type: string
      required: true
      default: ""
  - service:
      type: record<serviceDefinition>
      default: ""
      assign: true
  - active:
      type: boolean
      required: true
      default: true
  - autoApply:
      type: boolean
      required: true
      default: true
  - promoCode:
      type: string
      default: ""
  - discountType:
      type: enum<"percentage" | "fixed_amount">
      required: true
      default: percentage
  - discountValue:
      type: number
      required: true
      default: 0
  - applyMode:
      type: enum<"best_only" | "stackable">
      required: true
      default: best_only
  - target:
      type: enum<"booking_total" | "player_line_item" | "service_total">
      required: true
      default: booking_total
  - minBookingTotal:
      type: number
      default: 0
  - maxDiscountAmount:
      type: number
      default: 0
  - maxUses:
      type: number
      default: 0
  - usedCount:
      type: number
      default: 0
  - effectiveFrom:
      type: datetime
      default: null
  - effectiveTo:
      type: datetime
      default: null
  - priority:
      type: number
      default: 0
  - conditions:
      type: object
  - metadata:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: promotionRule
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - key
      - name
      - service
      - active
      - autoApply
      - promoCode
      - discountType
      - discountValue
      - applyMode
      - target
      - minBookingTotal
      - maxDiscountAmount
      - maxUses
      - usedCount
      - effectiveFrom
      - effectiveTo
      - priority
      - conditions
      - metadata
refreshViews: true
admin:
  slugPolicy: key
