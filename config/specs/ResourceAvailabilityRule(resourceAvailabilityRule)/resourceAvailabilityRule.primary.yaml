version: 1
kind: table
name: ResourceAvailabilityRule
primary: true
tableType: primary
description: Resource availability and peak/off-peak windows
table:
  model: resourceAvailabilityRule
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: ResourceAvailabilityRuleId
  structure: key
fields:
  - key:
      type: string
      required: true
      default: ""
  - resource:
      type: record<resource>
      required: true
      default: ""
      assign: true
  - service:
      type: record<serviceDefinition>
      default: ""
      assign: true
