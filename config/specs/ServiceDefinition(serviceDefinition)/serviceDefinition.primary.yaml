version: 1
kind: table
name: ServiceDefinition
primary: true
tableType: primary
description: Booking flow configuration per CTA/service
table:
  model: serviceDefinition
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: ServiceDefinitionId
  structure: key
fields:
  - key:
      type: string
      required: true
      default: ""
  - name:
      type: string
      required: true
      default: ""
  - ctaSlug:
      type: string
      required: true
      default: ""
  - serviceType:
      type: enum<"standard" | "driving_range" | "kids_party" | "corporate" |
        "coaching">
      required: true
      default: standard
  - active:
      type: boolean
      required: true
      default: true
  - durationMode:
      type: enum<"fixed" | "selectable">
      required: true
      default: selectable
  - fixedDurationMinutes:
      type: number
      default: 0
  - minDurationHours:
      type: number
      default: 1
  - maxDurationHours:
      type: number
      default: 4
  - durationStepHours:
      type: number
      default: 1
  - maxPlayersPerBay:
      type: number
      default: 4
  - maxPeoplePerBay:
      type: number
      default: 6
  - requiresBay:
      type: boolean
      required: true
      default: true
  - requiresCoach:
      type: boolean
      default: false
  - requiresOffPeakOnly:
      type: boolean
      default: false
  - supportsLeftHandedFilter:
      type: boolean
      default: false
  - autoAssignResources:
      type: boolean
      required: true
      default: true
  - maxHoldMinutes:
      type: number
      required: true
      default: 10
  - settings:
      type: object
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: serviceDefinition
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - key
      - name
      - ctaSlug
      - serviceType
      - active
      - durationMode
      - fixedDurationMinutes
      - minDurationHours
      - maxDurationHours
      - durationStepHours
      - maxPlayersPerBay
      - maxPeoplePerBay
      - requiresBay
      - requiresCoach
      - requiresOffPeakOnly
      - supportsLeftHandedFilter
      - autoAssignResources
      - maxHoldMinutes
      - settings
refreshViews: true
admin:
  slugPolicy: key
