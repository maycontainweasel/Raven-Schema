version: 1
kind: table
name: Transaction
primary: true
tableType: primary
description: Normalized transaction candidate
table:
  model: transaction
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  exportType: true
  exportName: TransactionId
  structure: stringID<account, key>
modelSettings:
  authority: source
fields:
  - space:
      type: record<financialSpace>
      required: true
      default: ""
      assign: true
  - account:
      type: record<account>
      required: true
      default: ""
      assign: true
  - key:
      type: string
      required: true
      default: ""
  - sourceRow:
      type: record<statementRow>
      default: ""
  - postedAt:
      type: datetime
      required: true
      default: ""
  - effectiveAt:
      type: datetime
      default: null
  - description:
      type: string
      required: true
      default: ""
  - normalizedDescription:
      type: string
      default: ""
  - amount:
      type: number
      required: true
      default: 0
  - balance:
      type: number
      default: 0
  - currency:
      type: string
      required: true
      default: ZAR
  - direction:
      type: enum<"debit" | "credit" | "transfer">
      required: true
      default: debit
  - status:
      type: enum<"imported" | "normalized" | "matched" | "classified" | "clarified" |
        "ignored">
      required: true
      default: normalized
  - confidence:
      type: number
      default: 0
  - merchantName:
      type: string
      default: ""
  - merchant:
      type: record<merchant>
      default: ""
  - category:
      type: record<category>
      default: ""
  - isTransfer:
      type: boolean
      default: false
  - manualOverride:
      type: boolean
      default: false
  - notes:
      type: string
      default: ""
edges:
  has:
    - table: TransactionMerchant
      in: transaction
      out: merchant
      unique: true
    - table: TransactionCategory
      in: transaction
      out: category
      unique: true
    - table: TransactionClarificationTasks
      in: transaction
      out: clarificationTask
      unique: true
  belongs: []
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: transaction
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
refreshViews: true
admin:
  authority: source
  data: source
