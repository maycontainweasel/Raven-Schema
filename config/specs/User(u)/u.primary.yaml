version: 1
kind: table
name: User
primary: true
tableType: primary
description: A basic user table
table:
  model: u
  type: NORMAL
  schemaMode: schemaless
  permissions: full
id:
  type: string
  structure: email
  exportType: true
  exportName: UserId
fields:
  - email:
      type: email
      required: true
      default: ""
  - password:
      type: password
      required: true
      default: ""
      assign: true
  - firstName:
      type: string
      required: true
      default: ""
  - surname:
      type: string
      required: true
      default: ""
  - uniqueId:
      type: md5<$email>
      assign: true
      ignorePayload: true
  - role:
      type: record<term>
      required: true
crud:
  create:
    enabled: true
    name: create__NAME__
    params:
      - name: payload
        type: object
  update:
    enabled: true
    name: update__NAME__
    params:
      - name: rid
        type: record
      - name: payload
        type: object
  delete:
    enabled: true
    name: delete__NAME__
    params:
      - name: rid
        type: record
router:
  name: user
  endpoints:
    - create
    - update
    - delete
    - views: "*"
views:
  - name: Admin
    fields:
      - id
      - email
      - password
      - firstName
      - surname
      - uniqueId
taxonomies:
  - key: role
    labels:
      singular: Role
      plural: Roles
    taxonomy:
      id: stringID<u, role>
      fields:
        - key:
            type: string
            required: true
        - label:
            type: string
            required: true
        - hierarchical:
            type: boolean
            required: false
            default: false
        - permalink:
            type: <permalink<<field:key>>>
            required: false
            assign: true
        - description: User roles
    term:
      id: <field:key>
      fields:
        - key:
            type: string
            required: true
        - label:
            type: string
            required: true
        - description:
            type: string
            required: false
        - parent:
            type: record<term>
            required: false
            default: ""
    hierarchical: false
    cardinality: one
    storeOnModel: true
    payloadField: role
    payloadAliases:
      - roles
    required: true
    processor: functions
instance: true
post: true
refreshViews: true
admin:
  data: local
