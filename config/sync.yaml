# Schema sync config (rsync)
# Run from repo root:
# pnpm -C apps/schema schema:sync -- --dry-run

# Absolute path to this repo (source root)
root: /Users/michaelpeters/Dev/mpd/projects/mpd-schema

# Safe default
# dryRun: true

destRoot: /absolute/path/to/target/repo

globalExclude:
  - "**/node_modules/**"
  - "**/.nuxt/**"
  - "**/.output/**"
  - "**/dist/**"
  - "**/.turbo/**"
  - "**/.git/**"
  - "**/.DS_Store"
  - "**/sync-itemize.log"

# Named destination roots (optional)
# Use --destination <name> to pick one
# destinations:
#   - name: schema-clone
#     root: /absolute/path/to/target/repo

targets:
  # Primary schema app (tooling + generators + layers + module)
  - name: schema-app
    root: ./apps/schema
    include:
      - "**/*"
    exclude:
      - "node_modules/**"
      - "schema-docs/.nuxt/**"
      - "schema-docs/.output/**"
    projects:
      - name: schema-app
        # Relative to destination root (repo root)
        dest: apps/schema
        mode: overwrite
        packageJson:
          preserve:
            - name

  # Optional: sync shared packages (uncomment if needed)
  # - name: shared-packages
  #   root: ./packages
  #   include:
  #     - "**/*"
  #   exclude:
  #     - "**/node_modules/**"
  #     - "**/dist/**"
  #   projects:
  #     - name: shared-packages
  #       dest: packages
  #       mode: overwrite
