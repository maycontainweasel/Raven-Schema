version: 1
kind: ui
name: Fact
model: fact
table: fact
namespace: facts

route:
  base: /facts
  single: /facts/<id>

meta:
  title: "Facts"
  subtitle: "Manage short fact snippets"

dialogs:
  create:
    template: auto
    required:
      - title
      - body
      - instances
    fields:
      - key: title
        label: Title
        type: text
        placeholder: Fact title
        required: true
      - key: body
        label: Fact
        type: textarea
        rows: 4
        placeholder: Enter the fact content
        required: true
      - key: source
        label: Source
        type: text
        placeholder: Optional source
      - key: order
        label: Order
        type: number
        placeholder: 0
      - key: active
        label: Active
        type: select
        options:
          - label: Yes
            value: true
          - label: No
            value: false
      - key: instances
        label: Instances
        type: instances
        placeholder: Select instances
        multiple: true
        required: true
    defaults:
      instances:
        - $rootInstance
      active: true
  delete:
    template: auto

overview:
  type: typesense
  meta:
    title: "Facts Overview"
    subtitle: "Browse and update fact snippets."
  actions:
    - create
    - refresh
  table:
    columns:
      - title
      - order
      - active
      - instances
  typesense:
    pagination: true
    refreshMode: upsert
    queryBy:
      - title
      - body
      - source
    sortableFields:
      - order
      - title
    filters:
      - instances
      - active

single:
  layout: navigation-primary
  store:
    key: fact
    resolver: id
  targets:
    base:
      model: fact
      endpoint: fact.update
  header:
    label: "Fact"
  tabs:
    - label: Details
      slug: details
      content:
        - id: fact-details-row
          primary:
            - id: fact-details-col
              class: "flex-[2]"
              widgets:
                - type: fields-card
                  id: fact-details
                  title: "Fact Details"
                  subtitle: "Primary copy and visibility."
                  content:
                    - columns:
                        - items:
                            - field: title
                              type: text
                              label: "Title"
                            - field: order
                              type: number
                              label: "Order"
                            - field: active
                              type: select
                              label: "Active"
                              options:
                                - label: Yes
                                  value: true
                                - label: No
                                  value: false
                        - items:
                            - field: source
                              type: text
                              label: "Source"
                            - field: body
                              type: textarea
                              rows: 5
                              label: "Fact"
                    - columns:
                        - items:
                            - field: instances
                              type: instances
                              label: "Instances"
                              multiple: true
