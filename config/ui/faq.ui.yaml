version: 1
kind: ui
name: FAQ
model: faq
table: faq
namespace: faqs

route:
  base: /faqs
  single: /faqs/<id>

meta:
  title: "FAQs"
  subtitle: "Manage frequently asked questions"

dialogs:
  create:
    template: auto
    required:
      - question
      - answer
      - category
      - instances
    fields:
      - key: question
        label: Question
        type: textarea
        rows: 3
        placeholder: Enter the FAQ question
        required: true
      - key: answer
        label: Answer
        type: textarea
        rows: 5
        placeholder: Enter the answer
        required: true
      - key: category
        label: Category
        type: text
        placeholder: e.g. billing
        required: true
      - key: instances
        label: Instances
        type: instances
        placeholder: Select instances
        multiple: true
        required: true
    defaults:
      instances:
        - $rootInstance
  delete:
    template: auto

overview:
  type: typesense
  meta:
    title: "FAQ Overview"
    subtitle: "Browse and update FAQ entries."
  actions:
    - create
    - refresh
  table:
    columns:
      - question
      - category
      - instances
  typesense:
    pagination: true
    refreshMode: upsert
    queryBy:
      - question
      - answer
      - category
    sortableFields:
      - question
      - category
    filters:
      - instances

single:
  layout: navigation-primary
  store:
    key: faq
    resolver: id
  targets:
    base:
      model: faq
      endpoint: faq.update
  header:
    label: "FAQ"
  tabs:
    - label: Details
      slug: details
      content:
        - id: faq-details-row
          primary:
            - id: faq-details-col
              class: "flex-[2]"
              widgets:
                - type: fields-card
                  id: faq-details
                  title: "FAQ Details"
                  subtitle: "Question, answer, and category."
                  content:
                    - columns:
                        - items:
                            - field: question
                              type: textarea
                              rows: 3
                              label: "Question"
                            - field: category
                              type: text
                              label: "Category"
                        - items:
                            - field: answer
                              type: textarea
                              rows: 6
                              label: "Answer"
                    - columns:
                        - items:
                            - field: instances
                              type: instances
                              label: "Instances"
                              multiple: true
