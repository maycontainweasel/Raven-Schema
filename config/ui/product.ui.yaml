version: 1
kind: ui
name: Product
model: product
table: product
namespace: products

route:
  base: /products
  single: /products/<key>

meta:
  title: "Products"
  subtitle: "Manage product records and pricing"

overview:
  table:
    columns:
      - instances
      - key
      - title
      - description

dialogs:
  create:
    template: auto
    required:
      - key
      - title
    fields:
      - key: key
        label: Key
        type: text
      - key: title
        label: Title
        type: text
      - key: description
        label: Description
        type: textarea
        rows: 3
      - key: slug
        label: Slug
        type: text
      - key: stripePID
        label: Stripe Product ID
        type: text
      - key: instances
        label: Instances
        type: instances

single:
  layout: navigation-primary
  store:
    key: product
    resolver: key
  targets:
    base:
      model: product
      endpoint: product.update
    postStatus:
      endpoint: admin.updatePostStatus
      payloadMap:
        recordId: $recordId
        status: $field:post.status
  header:
    label: "Product"
    statusTarget: postStatus
  tabs:
    - label: General
      slug: general
      content:
        - id: product-general-row
          primary:
            - id: product-general-col-main
              class: "flex-[2]"
              widgets:
                - type: fields-card
                  id: product-general
                  title: "General Information"
                  subtitle: "Core product details."
                  content:
                    - columns:
                        - items:
                            - field: title
                              type: text
                              label: "Title"
                            - field: key
                              type: text
                              label: "Product Key"
                        - items:
                            - field: description
                              type: textarea
                              label: "Description"
                              rows: 4
                - type: fields-card
                  id: product-exams
                  title: "Linked Exams"
                  subtitle: "Attach or detach exams from this product."
                  save: false
                  content:
                    - columns:
                        - items:
                            - type: message
                              text: "Exam linking UI will be provided via override."
                              class: "text-xs text-muted"
            - id: product-general-col-side
              class: "flex-1"
              widgets:
                - type: fields-card
                  id: product-stripe-status
                  title: "Stripe Status"
                  subtitle: "Stripe sync and diagnostics."
                  save: false
                  content:
                    - columns:
                        - items:
                            - type: message
                              text: "Stripe status widget will be provided via override."
                              class: "text-xs text-muted"
    - label: Pricing
      slug: pricing
      content:
        - id: product-pricing-row
          primary:
            - id: product-pricing-col
              widgets:
                - type: fields-card
                  id: product-pricing
                  title: "Pricing & Variants"
                  subtitle: "Variant manager will be provided via override."
                  save: false
                  content:
                    - columns:
                        - items:
                            - type: message
                              text: "Pricing/variant UI will be supplied via override."
                              class: "text-xs text-muted"
    - label: Metadata
      slug: metadata
      content:
        - id: product-metadata-row
          primary:
            - id: product-metadata-col
              widgets:
                - type: fields-card
                  id: product-metadata
                  title: "Product Metadata"
                  subtitle: "Additional info and settings."
                  content:
                    - columns:
                        - items:
                            - field: statement_descriptor
                              type: text
                              label: "Statement Descriptor"
                            - field: created_at
                              type: text
                              label: "Created"
                              props:
                                readonly: true
                                disabled: true
                            - field: updated_at
                              type: text
                              label: "Updated"
                              props:
                                readonly: true
                                disabled: true
                            - field: stripePID
                              type: text
                              label: "Stripe Product ID"
                              props:
                                readonly: true
                                disabled: true
    - label: Stripe
      slug: stripe
      content:
        - id: product-stripe-row
          primary:
            - id: product-stripe-col
              widgets:
                - type: fields-card
                  id: product-stripe
                  title: "Stripe Integration"
                  subtitle: "Stripe sync and diagnostics."
                  save: false
                  content:
                    - columns:
                        - items:
                            - type: message
                              text: "Stripe tooling will be provided via override."
                              class: "text-xs text-muted"
