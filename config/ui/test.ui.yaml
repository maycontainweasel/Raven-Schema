version: 1
kind: ui
name: Test
model: question
table: q
namespace: ui-test

route:
  base: /ui-test
  single: /ui-test/<id.id>

overview:
  type: typesense
  meta:
    title: "UI Test Overview"
    subtitle: "Generated overview for UI test spec."
  actions:
    - refresh

single:
  layout: navigation-primary
  store:
    key: question
    resolver: id.id
  tabs:
    - label: Overview
      slug: overview
      content:
        - id: test-overview-row
          class: "bg-purple-500"
          primary:
            - id: test-overview-col-qid
              class: "bg-red-500"
              widgets:
                - type: fields-card
                  id: test-qid
                  title: "Question ID"
                  subtitle: "Primary numeric identifier for the question."
                  fields:
                    - field: qid
                      type: number
                      model: q
                      label: "QID"
                      placeholder: "e.g. 200001"
                      required: true
            - id: test-overview-col-question
              class: "bg-blue-500"
              widgets:
                - type: fields-card
                  id: test-question
                  title: "Question Text"
                  subtitle: "Main question prompt."
                  fields:
                    - field: question
                      type: text
                      label: "Question"
                      placeholder: "Enter the question text"
                      required: true
    - label: Settings
      slug: settings
      content:
        - id: test-settings-row
          class: "bg-emerald-500"
          primary:
            - id: test-settings-col
              class: "bg-amber-500"
              widgets:
                - type: fields-card
                  id: test-settings
                  title: "Question Settings"
                  subtitle: "Default settings panel."
                  fields:
                    - field: qid
                      type: number
                      label: "QID"
                      placeholder: "e.g. 200001"
                      required: true
                    - field: question
                      type: textarea
                      label: "Question"
                      placeholder: "Enter the question text"
                      rows: 4
                      required: true
    - label: Fields
      slug: fields
      content:
        - id: test-fields-row
          class: "bg-sky-500"
          primary:
            - id: test-fields-col
              class: "bg-indigo-500"
              widgets:
                - type: fields-card
                  id: test-fields
                  title: "Field Types"
                  subtitle: "Preview field components and props."
                  save: false
                  fields:
                    - field: demoText
                      type: text
                      label: "Text"
                      placeholder: "Text value"
                    - field: demoNumber
                      type: number
                      label: "Number"
                      placeholder: "123"
                      min: 0
                      max: 1000
                      step: 1
                    - field: demoTextarea
                      type: textarea
                      label: "Textarea"
                      placeholder: "Longer content..."
                      rows: 4
                    - field: demoSelect
                      type: select
                      label: "Select"
                      placeholder: "Pick one"
                      options:
                        - label: "Alpha"
                          value: "alpha"
                        - label: "Beta"
                          value: "beta"
                    - field: demoListbox
                      type: listbox
                      label: "Listbox"
                      placeholder: "Select..."
                      options:
                        - label: "One"
                          value: 1
                        - label: "Two"
                          value: 2
                    - field: demoCombobox
                      type: combobox
                      label: "Combobox"
                      placeholder: "Search..."
                      options:
                        - label: "Gamma"
                          value: "gamma"
                        - label: "Delta"
                          value: "delta"
                    - field: demoDate
                      type: date
                      label: "Date"
                      placeholder: "Pick a date"
                      allowClear: true
