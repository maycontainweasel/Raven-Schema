promotion_rules:
  app_owned_exact:
    - config/graph.mpdg
    - config/app.config.yaml
    - config/schema-assets.json
    - config/sync.yaml
  app_owned_prefixes:
    - config/specs/
    - config/migrations/
    - config/ui/
    - config/ui-back/
    - sites/
    - config/overrides/
  framework_safe_exact:
    - AGENTS.md
    - package.json
    - .gitignore
    - .gitignore.app.example
    - config/nginx.template.conf
  framework_safe_prefixes:
    - .agents/
    - docs/
    - module/
    - scripts/
    - src/
    - types/
  framework_review_exact:
    - schema-docs/package.json
  framework_review_prefixes:
    - config/bootstrap/
    - layers/
    - schema-docs/test/capabilities/
