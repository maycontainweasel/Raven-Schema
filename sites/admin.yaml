name: admin
slug: admin
template: templates/nuxt-4.3.0
target: apps/admin
deploy:
  host: mpire.live
  domain: admin.mpire.live
  port: 2500
  appDir: /home/mpire/admin
  pm2Name: admin
  pm2Command: pm2
  nginxSitesEnabled: /etc/nginx/sites-enabled
  restartCommand: systemctl reload nginx
  overwriteNginx: true
  overwriteApp: true
  startPm2: true
  setupComplete: true
