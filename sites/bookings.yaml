name: bookings
slug: bookings
template: templates/nuxt-4.3.0
target: apps/bookings
nuxtConfig:
  unocss:
    nuxtLayers: true
    preflight: true
    configFile: ./uno.config.ts
  devServer:
    port: 2941
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - bookings.gr.schema.local
      origin: https://bookings.gr.schema.local:4443
      hmr:
        protocol: wss
        host: bookings.gr.schema.local
        clientPort: 4443
        path: /__vitews
        port: 47531
  extends:
    - ./layers/schema-core
  modules:
    - "@unocss/nuxt"
deploy:
  ssl:
    email: michael@mpiredigital.co.za
    redirect: true
  host: mpire.live
  domain: bookings.golfroom.mpire.live
  port: 4041
  pm2Name: bookings
  pm2Command: pm2
  nginxSitesEnabled: /etc/nginx/sites-enabled
  restartCommand: systemctl reload nginx
  remoteNginxSudo: true
  overwriteNginx: true
  overwriteApp: true
  startPm2: true
  remoteName: bookings
  remoteRoot: $HOME
  remotePath: bookings
  setupComplete: true
layers:
  - schema-core
  - helios
  - helios-ui
schemaKit:
  capabilities: {}
