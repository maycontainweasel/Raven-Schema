name: dashboard
slug: dashboard
template: templates/nuxt-4.3.0
target: apps/dashboard
deploy:
  ssl:
    email: ""
    redirect: true
nuxtConfig:
  devServer:
    port: 8302
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - dashboard.v3.passmed.local
      origin: https://dashboard.v3.passmed.local:4443
      hmr:
        protocol: wss
        host: dashboard.v3.passmed.local
        clientPort: 4443
        path: /__vitews
        port: 47821
  extends:
    - ./layers/schema-core
  modules:
    - ~~/modules/schema-kit
  build:
    transpile:
      - trpc-nuxt
layers:
  - schema-core
schemaKit:
  capabilities: {}
