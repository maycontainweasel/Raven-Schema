name: pub2
slug: pub2
template: templates/nuxt-4.3.0
target: apps/pub2
deploy:
  ssl:
    email: ""
    redirect: true
nuxtConfig:
  devServer:
    port: 2345
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - pub2.schema.local
      origin: https://pub2.schema.local:4443
      hmr:
        protocol: wss
        host: pub2.schema.local
        clientPort: 4443
        path: /__vitews
        port: 49983
  extends:
    - ./layers/schema-core
layers:
  - schema-core
