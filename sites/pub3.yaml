name: pub3
slug: pub3
template: templates/nuxt-4.3.0
target: apps/pub3
deploy:
  ssl:
    email: ""
    redirect: true
nuxtConfig:
  devServer:
    port: 3846
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - pub3.schema.local
      origin: https://pub3.schema.local:4443
      hmr:
        protocol: wss
        host: pub3.schema.local
        clientPort: 4443
        path: /__vitews
        port: 43616
  extends:
    - ./layers/schema-core
layers:
  - schema-core
packages:
  dependencies:
    pinia: latest
    "@pinia/nuxt": latest
