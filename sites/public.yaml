name: public
slug: public
template: templates/nuxt-4.3.0
target: apps/public
nuxtConfig:
  unocss:
    nuxtLayers: true
    preflight: true
    configFile: ./uno.config.ts
  devServer:
    port: 8301
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - public.v3.passmed.local
      origin: https://public.v3.passmed.local:4443
      hmr:
        protocol: wss
        host: public.v3.passmed.local
        clientPort: 4443
        path: /__vitews
        port: 43902
  extends:
    - ./layers/schema-core
  modules:
    - "@unocss/nuxt"
deploy:
  ssl:
    email: ""
    redirect: true
layers:
  - schema-core
  - pm-za
  - helios
schemaKit:
  capabilities: {}
