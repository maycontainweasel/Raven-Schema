name: public
slug: public
template: templates/nuxt-4.3.0
target: apps/public
nuxtConfig:
  devServer:
    port: 2501
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - public.schema.dev
      origin: https://public.schema.dev:4443
      hmr:
        protocol: wss
        host: public.schema.dev
        clientPort: 4443
        path: /__vitews
        port: 49567
  extends:
    - ./layers/schema-core
layers:
  - schema-core
