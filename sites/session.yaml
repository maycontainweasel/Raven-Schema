name: session
slug: session
template: templates/nuxt-4.3.0
target: apps/session
deploy:
  ssl:
    email: ""
    redirect: true
nuxtConfig:
  devServer:
    port: 8303
    host: 0.0.0.0
  vite:
    server:
      allowedHosts:
        - session.v3.passmed.local
      origin: https://session.v3.passmed.local:4443
      hmr:
        protocol: wss
        host: session.v3.passmed.local
        clientPort: 4443
        path: /__vitews
        port: 42514
  extends:
    - ./layers/schema-core
  modules:
    - ~~/modules/schema-kit
  build:
    transpile:
      - trpc-nuxt
layers:
  - schema-core
schemaKit:
  capabilities: {}
