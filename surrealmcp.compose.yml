services:
  surrealmcp:
    image: surrealdb/surrealmcp:latest
    container_name: surrealmcp_711
    command: >
      start
      --bind-address 0.0.0.0:711
      --server-url http://localhost:711
      --endpoint ws://host.docker.internal:8000/rpc
      --ns mynamespace
      --db mydatabase
      --user root
      --pass root
      --auth-disabled
    ports:
      - "711:711"